[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readforme"
version = "0.1.0"
description = "Verified document reading for people who can't read the page: Cohere North Micro Vision + a grounding verifier + an eval harness."
readme = "../README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pillow>=10",
  "fastapi>=0.115",
  "python-multipart>=0.0.18",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Exact pins from the North-Micro-Vision model card (transformers==5.16.0).
transformers = ["torch", "transformers==5.16.0", "accelerate"]
eval = ["numpy", "rapidfuzz"]
dev = ["pytest"]

[project.scripts]
readforme = "readforme.cli:main"

[tool.setuptools.packages.find]
include = ["readforme*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
